# cgsn-parsers build configuration
# -----
# Continuum Analytics docker image from Docker Hub for miniconda.
image: continuumio/miniconda3

pipelines:
  custom: # Pipelines that are triggered manually
    unittest:
      - step:
          caches:
            - conda
          script:
            - conda update -n base conda
            - conda config --add channels conda-forge
            - conda install --yes --file requirements.txt
            - python -m unittest discover
  branches: # Pipelines that are triggered automatically for named branches only
    master:
      - step:
          caches:
            - conda
          script:
            - conda config --add channels conda-forge
            - conda install --yes --file requirements.txt
            - python -m unittest discover

definitions:
  caches:
    conda: continuumio/miniconda3
